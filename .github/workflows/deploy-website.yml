name: Deploy Vertex Digital site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: |
          cd Attached-Assets
          pnpm install --frozen-lockfile

      - name: Build site
        run: |
          cd Attached-Assets
          pnpm --dir artifacts/agency-site run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vertex-digital-dist
          path: Attached-Assets/artifacts/agency-site/dist

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Attached-Assets/artifacts/agency-site/dist
          force_orphan: true
